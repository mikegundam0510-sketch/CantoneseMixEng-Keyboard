name: Voice fix APK 0.6.10
on:
  push:
    branches: [codex/voice-fix-0.6.10]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Verify APK
        run: |
          mkdir -p device-test
          cp app/build/outputs/apk/debug/app-debug.apk device-test/cantonesemixeng-keyboard-0.6.10-voice-fix.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs device-test/*.apk > device-test/APK-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging device-test/*.apk >> device-test/APK-verification.txt
          sha256sum device-test/*.apk >> device-test/APK-verification.txt
          git rev-parse HEAD >> device-test/APK-verification.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cantonesemixeng-keyboard-0.6.10-voice-fix
          path: |
            device-test/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
