name: Combined signed APK
on:
  workflow_dispatch:
  push:
    branches: [codex/cangjie-space-predictions, codex/hk-personal-learning, codex/cangjie-compatible-codes, codex/windows-ime-code-compat, codex/fold7-reference-layout, codex/fold7-key-size]
permissions:
  contents: read
env:
  KAI_KEYSTORE_PASSWORD: ${{ secrets.KAI_KEYSTORE_PASSWORD }}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore persistent APK signing key
        env:
          KAI_KEYSTORE_B64: ${{ secrets.KAI_KEYSTORE_B64 }}
        run: python3 tools/restore_signing_key.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build combined APK
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Verify package
        run: |
          mkdir -p device-test apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/
          python3 tools/verify_apk_signing.py app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk device-test/cantonesemixeng-keyboard-0.6.23.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs device-test/*.apk > device-test/APK-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging device-test/*.apk >> device-test/APK-verification.txt
          sha256sum device-test/*.apk >> device-test/APK-verification.txt
          git rev-parse HEAD >> device-test/APK-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree device-test/*.apk AndroidManifest.xml > device-test/manifest.txt
          if grep -q FakeVoiceService device-test/manifest.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cantonesemixeng-keyboard-0.6.23
          path: device-test/
          retention-days: 14
      - name: Free space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual touch and layout acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash tools/enable_ime.sh
            adb shell wm size 720x1600
            adb shell wm density 320
            python3 tools/predictions_smoke.py
            bash tools/connected_acceptance.sh
            python3 tools/clipboard_smoke.py
            python3 tools/editor_smoke.py
            python3 tools/ui_smoke.py
            python3 tools/predictions_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-0.6.23-verification
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html
            clipboard-evidence/
            ui-evidence/
