name: Direct voice APK 0.6.13
on:
  push:
    branches: [codex/voice-direct-0.6.13]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Verify APK
        run: |
          mkdir -p device-test
          cp app/build/outputs/apk/debug/app-debug.apk device-test/cantonesemixeng-keyboard-0.6.13-direct-voice.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs device-test/*.apk > device-test/APK-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging device-test/*.apk >> device-test/APK-verification.txt
          sha256sum device-test/*.apk >> device-test/APK-verification.txt
          git rev-parse HEAD >> device-test/APK-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree device-test/*.apk AndroidManifest.xml > device-test/manifest.txt
          if grep -q FakeVoiceService device-test/manifest.txt; then exit 1; fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify direct voice and explicit offline mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          script: python3 tools/verify_selection.py 'hk.kaiboard.android.SwipeSelectionTest#systemVoiceStartsDirectlyAndCancelPreventsInsertion,hk.kaiboard.android.SwipeSelectionTest#voiceRecoveryAndCancel'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cantonesemixeng-keyboard-0.6.13-direct-voice
          path: |
            device-test/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            selection-evidence/
            voice-evidence/
          retention-days: 14
