name: Device test APK
on:
  push:
    branches: [codex/reference-keyboard-emoji]
    paths: [.github/workflows/apk-preview.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify device test APK
        run: |
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p device-test
          cp app/build/outputs/apk/debug/app-debug.apk device-test/cantonesemixeng-keyboard-0.6.1-device-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs device-test/cantonesemixeng-keyboard-0.6.1-device-test.apk > device-test/APK-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging device-test/cantonesemixeng-keyboard-0.6.1-device-test.apk >> device-test/APK-verification.txt
          sha256sum device-test/cantonesemixeng-keyboard-0.6.1-device-test.apk >> device-test/APK-verification.txt
          git rev-parse HEAD >> device-test/APK-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cantonesemixeng-keyboard-0.6.1-device-test
          path: device-test/
          retention-days: 14
