name: Device test APK 0.6.5
# Includes native handwriting acceptance. Raw IME inset diagnostics use the application's debuggable flag.
on:
  push:
    branches: [codex/reference-keyboard-emoji]
    paths: [.github/workflows/apk-preview.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Build and verify device test APK
        run: |
          bash ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
          mkdir -p device-test
          cp app/build/outputs/apk/debug/app-debug.apk device-test/cantonesemixeng-keyboard-0.6.5-device-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs device-test/cantonesemixeng-keyboard-0.6.5-device-test.apk > device-test/APK-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging device-test/cantonesemixeng-keyboard-0.6.5-device-test.apk >> device-test/APK-verification.txt
          sha256sum device-test/cantonesemixeng-keyboard-0.6.5-device-test.apk >> device-test/APK-verification.txt
          git rev-parse HEAD >> device-test/APK-verification.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native handwriting on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 tools/handwriting_smoke.py
      - name: Include handwriting evidence
        if: always()
        run: cp -r handwriting-evidence device-test/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cantonesemixeng-keyboard-0.6.5-device-test
          path: device-test/
          retention-days: 14
