name: Device test APK 0.6.9
# Wait for asynchronous stroke dictionary loading; checks symbol placement on cover and unfolded screens after IME registration and fixture/window initialization.
on:
  push:
    branches: [codex/reference-keyboard-emoji]
    paths: [.github/workflows/apk-preview.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify device test APK
        run: |
          bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
          mkdir -p device-test apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/
          cp app/build/outputs/apk/debug/app-debug.apk device-test/cantonesemixeng-keyboard-0.6.9-device-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs device-test/cantonesemixeng-keyboard-0.6.9-device-test.apk > device-test/APK-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging device-test/cantonesemixeng-keyboard-0.6.9-device-test.apk >> device-test/APK-verification.txt
          sha256sum device-test/cantonesemixeng-keyboard-0.6.9-device-test.apk >> device-test/APK-verification.txt
          git rev-parse HEAD >> device-test/APK-verification.txt
      - name: Free build-only tools before emulator startup
        run: |
          sudo env ANDROID_HOME="$ANDROID_HOME" python3 - <<'PY'
          import os, pathlib, shutil
          for target in (pathlib.Path('/usr/share/dotnet'), pathlib.Path(os.environ['ANDROID_HOME'])/'ndk'/'27.0.12077973'):
              if target.is_dir(): shutil.rmtree(target)
          PY
          df -h /
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify stroke input and clipboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: python3 tools/verify_strokes.py
      - name: Include device acceptance evidence
        if: always()
        run: |
          for folder in stroke-evidence symbol-evidence clipboard-evidence ui-evidence acceptance-evidence; do
            if [ -d "$folder" ]; then cp -r "$folder" device-test/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cantonesemixeng-keyboard-0.6.9-device-test
          path: device-test/
          retention-days: 14
