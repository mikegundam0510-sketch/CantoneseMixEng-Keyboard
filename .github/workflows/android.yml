name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Test, lint and prepare internal emulator package
        run: |
          bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/
      - name: Compare loading and retained heap with baseline
        run: python3 tools/loading_benchmark.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          script: bash ./gradlew connectedDebugAndroidTest --no-daemon && python3 tools/clipboard_smoke.py && python3 tools/editor_smoke.py && python3 tools/ui_smoke.py
      - name: Save test reports and actual UI screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Keyboard-verification-evidence
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html
            ui-evidence/
            clipboard-evidence/
      - name: Remove internal test package
        if: always()
        run: rm -rf apk app/build/outputs/apk

