name: Navigation clearance
on:
  push:
    branches: [codex/reference-keyboard-emoji]
    paths:
      - 'app/src/main/java/hk/kaiboard/android/KaiboardService.java'
      - 'tools/navigation_smoke.py'
      - '.github/workflows/navigation.yml'
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash ./gradlew assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 tools/navigation_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Navigation-evidence-api-${{ matrix.api }}
          path: navigation-evidence/
