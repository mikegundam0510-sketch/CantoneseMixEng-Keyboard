name: Navigation clearance
on:
  push:
    branches: [codex/reference-keyboard-emoji]
    paths:
      - 'app/src/main/java/hk/kaiboard/android/KaiboardService.java'
      - 'tools/navigation_smoke.py'
      - '.github/workflows/navigation.yml'
permissions:
  contents: read
env:
  KAI_KEYSTORE_PASSWORD: ${{ secrets.KAI_KEYSTORE_PASSWORD }}
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore persistent APK signing key
        env:
          KAI_KEYSTORE_B64: ${{ secrets.KAI_KEYSTORE_B64 }}
        run: python3 tools/restore_signing_key.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: bash ./gradlew assembleDebug --no-daemon
      - name: Free build tools for emulator
        run: |
          sudo python3 - "$ANDROID_HOME" <<'PY'
          import sys, pathlib, shutil
          for target in (pathlib.Path('/usr/share/dotnet'), pathlib.Path(sys.argv[1])/'ndk'/'27.0.12077973'):
              if target.is_dir(): shutil.rmtree(target)
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: python3 tools/navigation_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Navigation-evidence-api-${{ matrix.api }}
          path: navigation-evidence/

