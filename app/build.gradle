plugins { id 'com.android.application' }

android {
    namespace 'hk.kaiboard.android'
    compileSdk 35
    defaultConfig {
        applicationId 'hk.kaiboard.android'
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName '0.6.15'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
}

tasks.register('prepareStrokeData', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/prepare_stroke_data.py'
    inputs.files rootProject.file('tools/prepare_stroke_data.py'), file('src/main/assets/cangjie5.base.dict.yaml'), file('src/main/assets/character_frequencies.tsv')
    outputs.file 'src/main/assets/stroke.tsv'
    outputs.dir 'src/main/assets/licenses/stroke'
}
tasks.named('preBuild').configure { dependsOn 'prepareStrokeData' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
