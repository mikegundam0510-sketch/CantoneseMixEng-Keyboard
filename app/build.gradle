plugins { id 'com.android.application' }
def semanticEnabled = System.getenv('KAI_SEMANTIC_MODEL') == 'true'

def persistentStore = System.getenv('KAI_KEYSTORE_PATH') ?: project.findProperty('kaiKeystorePath')
def persistentPasswordFile = project.findProperty('kaiKeystorePasswordFile')
def persistentPassword = System.getenv('KAI_KEYSTORE_PASSWORD')?.trim()
if (persistentStore && !persistentPassword && persistentPasswordFile)
    persistentPassword = file(persistentPasswordFile).text.trim()
if (System.getenv('KAI_REQUIRE_STABLE_SIGNING') == 'true' && (!persistentStore || !persistentPassword))
    throw new GradleException('Persistent signing key is required for distributed APKs')
if (persistentStore && !persistentPassword)
    throw new GradleException('KAI_KEYSTORE_PASSWORD is required with KAI_KEYSTORE_PATH')
if (persistentStore) {
    def store = java.security.KeyStore.getInstance('PKCS12')
    file(persistentStore).withInputStream { stream -> store.load(stream, persistentPassword.toCharArray()) }
    def certificate = store.getCertificate('cantonesemixeng')
    if (certificate == null || !store.isKeyEntry('cantonesemixeng'))
        throw new GradleException('Persistent signing alias cantonesemixeng is missing')
    def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
    def expected = rootProject.file('.github/signing-cert.sha256').text.trim().toLowerCase(Locale.ROOT)
    if (fingerprint != expected)
        throw new GradleException('Signing certificate differs from the pinned persistent signer; refusing an incompatible update')
}
gradle.taskGraph.whenReady { graph ->
    if (!persistentStore && graph.allTasks.any { it.project == project && it.name in ['packageRelease', 'signReleaseBundle'] })
        throw new GradleException('Release packaging requires the pinned persistent signing key')
}

android {
    namespace 'hk.kaiboard.android'
    compileSdk 35
    defaultConfig {
        applicationId 'hk.kaiboard.android'
        minSdk 26
        targetSdk 35
        versionCode 42
        versionName '0.6.35'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'SEMANTIC_MODEL', semanticEnabled.toString()
        if (semanticEnabled) {
            ndk { abiFilters 'arm64-v8a', 'x86_64' }
            externalNativeBuild {
                cmake { arguments '-DLLAMA_SOURCE=' + rootProject.file('.native/llama').absolutePath }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (persistentStore) {
            persistent {
                storeFile file(persistentStore)
                storeType 'PKCS12'
                storePassword persistentPassword
                keyAlias 'cantonesemixeng'
                keyPassword persistentPassword
            }
        }
    }
    buildTypes {
        debug { if (persistentStore) signingConfig signingConfigs.persistent }
        release {
            minifyEnabled false
            if (persistentStore) signingConfig signingConfigs.persistent
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
        // Tests load several independent copies of the complete offline dictionary/model.
        unitTests.all { maxHeapSize = '1g' }
    }
    buildFeatures { buildConfig true }
    if (semanticEnabled) {
        ndkVersion '27.0.12077973'
        externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
        sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/semanticAssets')
        androidResources { noCompress 'gguf' }
    }
}

tasks.register('prepareStrokeData', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/prepare_stroke_data.py'
    inputs.files rootProject.file('tools/prepare_stroke_data.py'), file('src/main/assets/cangjie5.base.dict.yaml'), file('src/main/assets/character_frequencies.tsv')
    outputs.file 'src/main/assets/stroke.tsv'
    outputs.dir 'src/main/assets/licenses/stroke'
}
tasks.named('preBuild').configure { dependsOn 'prepareStrokeData' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
