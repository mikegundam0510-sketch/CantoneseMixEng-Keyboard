plugins { id 'com.android.application' }

android {
    namespace 'hk.kaiboard.android'
    compileSdk 35
    ndkVersion '27.0.12077973'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    defaultConfig {
        applicationId 'hk.kaiboard.android'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.6.8'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
}

tasks.register('prepareHandwritingModel', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/prepare_handwriting_model.py'
    inputs.files rootProject.file('tools/prepare_handwriting_model.py'), rootProject.file('tools/build_handwriting_shapes.py')
    outputs.file 'src/main/assets/handwriting-zh_TW.model'
    outputs.file 'src/main/assets/handwriting-shapes.bin'
    outputs.dir 'src/main/assets/licenses/handwriting'
}
tasks.named('preBuild').configure { dependsOn 'prepareHandwritingModel' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
